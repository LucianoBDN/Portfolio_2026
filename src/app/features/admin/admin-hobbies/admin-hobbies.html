<span class="section-eyebrow">Fuera del código</span>
<h1>Hobbies</h1>

<form class="inline-form" [formGroup]="form" (ngSubmit)="submit()">
  <input type="text" formControlName="emoji" placeholder="Emoji (🏋️)" style="width: 70px" />
  <input type="text" formControlName="label" placeholder="Etiqueta (ej. Gimnasio)" />
  <input type="number" formControlName="sort_order" placeholder="Orden" />
  <button type="submit" class="btn btn-primary">{{ editingId() ? 'Actualizar' : 'Agregar' }}</button>
  @if (editingId()) {
    <button type="button" class="btn btn-outline" (click)="cancelEdit()">Cancelar</button>
  }
</form>

@if (loading()) {
  <p>Cargando...</p>
} @else {
  <table>
    <thead>
      <tr><th>Emoji</th><th>Etiqueta</th><th>Orden</th><th></th></tr>
    </thead>
    <tbody>
      @for (hobby of hobbies(); track hobby.id) {
        <tr>
          <td>{{ hobby.emoji }}</td>
          <td>{{ hobby.label }}</td>
          <td>{{ hobby.sort_order }}</td>
          <td class="actions">
            <button type="button" (click)="edit(hobby)">Editar</button>
            <button type="button" class="danger" (click)="remove(hobby.id)">Eliminar</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="4">Todavía no hay hobbies cargados.</td></tr>
      }
    </tbody>
  </table>
}
