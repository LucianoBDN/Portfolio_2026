<div class="login-screen">
  <button
    type="button"
    class="theme-toggle"
    (click)="themeService.toggle()"
    [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  >
    <i class="ph-bold" [class.ph-sun]="themeService.theme() === 'dark'" [class.ph-moon]="themeService.theme() === 'light'"></i>
  </button>

  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <img
      class="brand-mark"
      [src]="themeService.theme() === 'dark' ? 'assets/bdn-mark-light.svg' : 'assets/bdn-mark-dark.svg'"
      alt="BDN"
    />
    <h1>Iniciar sesión</h1>

    <label>
      Email
      <input type="email" formControlName="email" placeholder="tu@email.com" />
    </label>
    <label>
      Contraseña
      <input type="password" formControlName="password" placeholder="••••••••" />
    </label>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="loading()">
      @if (loading()) { Ingresando... } @else { Ingresar }
    </button>

    <a class="back-link" routerLink="/">← Volver al sitio</a>
  </form>
</div>
