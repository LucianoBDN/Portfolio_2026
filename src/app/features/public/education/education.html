<section id="education" class="section" appRevealOnScroll>
  <span class="section-eyebrow">05 — Formación</span>
  <h2>Estudios y Certificados</h2>

  <div class="timeline">
    @for (item of items; track item.id) {
      <div class="timeline-item">
        <div class="timeline-marker"></div>
        <div class="timeline-content">
          <span class="date">{{ formatDate(item.date) }}</span>
          @if (item.certificate_url) {
            <a class="title-link" [href]="item.certificate_url" target="_blank" rel="noopener">
              <h3>{{ item.title }}</h3>
            </a>
          } @else {
            <h3>{{ item.title }}</h3>
          }
          <span class="institution">{{ item.institution }}</span>
        </div>
      </div>
    } @empty {
      <p>Todavía no hay estudios o certificados cargados.</p>
    }
  </div>
</section>
