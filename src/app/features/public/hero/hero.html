<section id="hero" class="hero" [ngStyle]="sectionStyle">
  <div class="hero-content" [ngStyle]="textStyle">
    <h1>
      <span class="greeting">{{ profile.hero_greeting }}</span>
      <span class="role">{{ profile.hero_role }}</span>
    </h1>
    <p class="subtitle">{{ profile.hero_subtitle }}</p>

    <div class="actions">
      <a class="btn btn-primary" href="#projects" (click)="scrollToProjects($event)">Ver proyectos</a>
      @if (profile.cv_url) {
        <a class="btn btn-outline" [href]="profile.cv_url" target="_blank" rel="noopener">Descargar CV</a>
      }
    </div>
  </div>
</section>
