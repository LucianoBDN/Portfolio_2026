<section id="technologies" class="section" appRevealOnScroll>
  <span class="section-eyebrow">02 — Stack</span>
  <h2>Tecnologías</h2>

  <div class="groups">
    @for (group of groups; track group.category) {
      <div class="group">
        <span class="group-title">{{ group.label }}</span>
        <div class="chips">
          @for (tech of group.items; track tech.id) {
            <div class="chip">
              <img class="chip-icon" [src]="'https://cdn.simpleicons.org/' + tech.icon_slug" [alt]="tech.name" loading="lazy" />
              <span>{{ tech.name }}</span>
            </div>
          }
        </div>
      </div>
    }
  </div>
</section>
